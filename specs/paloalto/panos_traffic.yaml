# PAN-OS TRAFFIC logs -> OCSF 1.9.0 Network Activity (4001)
#
# Column order and variable names: PAN-OS 11.1 "Traffic Log Fields",
# verification/vendor_refs/panos-11.1-traffic-log-format.json (130 columns).
# Columns beyond the documented layout (newer firmware) land in unmapped as
# _extra_<index>; nothing is dropped.
id: paloalto.panos.traffic
version: 1.1.0
status: approved
vendor: Palo Alto Networks
product: PAN-OS
description: PAN-OS traffic logs in the default syslog CSV format.
references:
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/traffic-log-fields
samples: synthetic
priority: 200
ocsf:
  class: network_activity
  profiles: [host, security_control]

match:
  all:
    - {field: after_pri, regex: '(?:^|\s)[0-9]+,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9:]{8},[^,]*,TRAFFIC,'}

parse:
  kind: csv
  input: after_pri
  # RFC 3164 header (timestamp + hostname) in front of the CSV body.
  extract: '^(?:(?P<syslog_ts>[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}) (?P<syslog_host>[^ ]+) )?(?P<payload>[0-9]+,[0-9]{4}/.*)$'
  csv:
    segments:
      - columns: [
          future_use_1, receive_time, serial, type, subtype, future_use_2, time_generated, src,
          dst, natsrc, natdst, rule, srcuser, dstuser, app, vsys,
          from, to, inbound_if, outbound_if, logset, future_use_3, sessionid, repeatcnt,
          sport, dport, natsport, natdport, flags, proto, action, bytes,
          bytes_sent, bytes_received, packets, start, elapsed, category, future_use_4, seqno,
          actionflags, srcloc, dstloc, future_use_5, pkts_sent, pkts_received, session_end_reason, device_group_hierarchy_level_1,
          device_group_hierarchy_level_2, device_group_hierarchy_level_3, device_group_hierarchy_level_4, vsys_name, device_name, action_source, src_uuid, dst_uuid,
          tunnelid_imsi, monitortag_imei, parent_session_id, parent_start_time, tunnel, assoc_id, chunks, chunks_sent,
          chunks_received, rule_uuid, http2_connection, link_change_count, policy_id, link_switches, sdwan_cluster, sdwan_device_type,
          sdwan_cluster_type, sdwan_site, dynusergroup_name, xff_ip, src_category, src_profile, src_model, src_vendor,
          src_osfamily, src_osversion, src_host, source_mac_address, dst_category, dst_profile, dst_model, dst_vendor,
          dst_osfamily, dst_osversion, dst_host, destination_mac_address, container_id, pod_namespace, pod_name, src_edl,
          dst_edl, hostid, serial_2, src_dag, dst_dag, session_owner, high_res_timestamp, nssai_sst,
          nssai_sd, subcategory_of_app, category_of_app, technology_of_app, risk_of_app, characteristic_of_app, container_of_app, tunneled_app,
          is_saas_of_app, sanctioned_state_of_app, offloaded, flow_type, cluster_name, ai_traffic, ai_forward_error, k8s_cluster_id,
          tcp_rtt_c2s, tcp_rtt_s2c, total_n_ooseq_c2s, total_n_ooseq_s2c, tcp_retransit_cnt_c2s, tcp_retransit_cnt_s2c, tcp_zero_window_cnt_c2s, tcp_zero_window_cnt_s2c,
          source_adv_devid, destination_adv_devid
        ]

time:
  # high resolution timestamp carries an explicit UTC offset
  - {field: high_res_timestamp, format: rfc3339}
  # ASSUMPTION: zone-less time_generated is UTC (recorded in ulpf.time.assumed_timezone)
  - {field: time_generated, format: "%Y/%m/%d %H:%M:%S", timezone: UTC}

fields:
  src:                    {to: src_endpoint.ip, type: ip}
  dst:                    {to: dst_endpoint.ip, type: ip}
  sport:                  {to: src_endpoint.port, type: port}
  dport:                  {to: dst_endpoint.port, type: port}
  from:                   {to: src_endpoint.zone, type: string}
  to:                     {to: dst_endpoint.zone, type: string}
  inbound_if:             {to: src_endpoint.interface_name, type: string}
  outbound_if:            {to: dst_endpoint.interface_name, type: string}
  src_host:               {to: src_endpoint.hostname, type: string}
  dst_host:               {to: dst_endpoint.hostname, type: string}
  source_mac_address:     {to: src_endpoint.mac, type: mac}
  destination_mac_address: {to: dst_endpoint.mac, type: mac}
  sessionid:              {to: connection_info.uid, type: string}
  proto:                  {to: connection_info.protocol_name, type: string, transform: lower}
  # "Bytes Sent: client-to-server direction" -> OCSF bytes_out (source -> destination)
  bytes:                  {to: traffic.bytes, type: long}
  bytes_sent:             {to: traffic.bytes_out, type: long}
  bytes_received:         {to: traffic.bytes_in, type: long}
  packets:                {to: traffic.packets, type: long}
  pkts_sent:              {to: traffic.packets_out, type: long}
  pkts_received:          {to: traffic.packets_in, type: long}
  rule:                   {to: firewall_rule.name, type: string}
  rule_uuid:              {to: firewall_rule.uid, type: string}
  app:                    {to: app_name, type: string}
  srcuser:                {to: actor.user.name, type: string}
  seqno:                  {to: metadata.sequence, type: int}
  session_end_reason:     {to: status_detail, type: string}
  device_name:            {to: device.hostname, type: string}
  serial:                 {to: device.uid, type: string}
  type:                   {to: metadata.log_name, type: string}
  natsrc:    {unmapped: true, note: "OCSF 1.9.0 has no NAT translation attributes (verified: no nat*/translat* in the dictionary)"}
  natdst:    {unmapped: true, note: "no NAT attributes in OCSF 1.9.0"}
  natsport:  {unmapped: true, note: "no NAT attributes in OCSF 1.9.0"}
  natdport:  {unmapped: true, note: "no NAT attributes in OCSF 1.9.0"}
  elapsed:   {unmapped: true, note: "OCSF 1.9.0 duration is aggregate-only (count > 1)"}
  start:     {unmapped: true, note: "OCSF 1.9.0 start_time is aggregate-only (count > 1)"}
  repeatcnt: {unmapped: true, note: "repeat count is an aggregation hint; OCSF count also requires start_time/end_time"}
  srcloc:    {unmapped: true, note: "country or private-range label, not an ISO 3166-1 alpha-2 code"}
  dstloc:    {unmapped: true, note: "country or private-range label, not an ISO 3166-1 alpha-2 code"}

enums:
  # subtype: start/end/drop/deny (documented). POLICY: activity choice.
  - source: subtype
    map:
      start: {activity_id: 1}
      end:   {activity_id: 2}
      drop:  {activity_id: 5}
      deny:  {activity_id: 5}
    default: {activity_id: 99}
    missing: {activity_id: 0}
  # action: documented values; the page shows both "reset both" and "reset-both".
  - source: action
    map:
      allow:          {action_id: 1, disposition_id: 1}
      deny:           {action_id: 2, disposition_id: 2}
      drop:           {action_id: 2, disposition_id: 6}
      drop icmp:      {action_id: 2, disposition_id: 6}
      drop-icmp:      {action_id: 2, disposition_id: 6}
      reset both:     {action_id: 2, disposition_id: 21}
      reset-both:     {action_id: 2, disposition_id: 21}
      reset client:   {action_id: 2, disposition_id: 21}
      reset-client:   {action_id: 2, disposition_id: 21}
      reset server:   {action_id: 2, disposition_id: 21}
      reset-server:   {action_id: 2, disposition_id: 21}
    default: {action_id: 99, disposition_id: 99}
    missing: {action_id: 0, disposition_id: 0}

set:
  device.type_id: 9          # Firewall
  # srcip/src are documented as the session source (originator)
  is_src_dst_assignment_known: true

derive:
  - {to: connection_info.protocol_num, using: iana_protocol_num, from: connection_info.protocol_name}
  - {to: connection_info.community_uid, using: community_id}

pii:
  - {field: srcuser, action: hmac_sha256}
  - {field: dstuser, action: hmac_sha256}

tests:
  - name: tcp_end_allowed
    raw: "<14>Oct  7 10:15:30 PA-VM-01 1,2026/10/07 10:15:30,007200001056,TRAFFIC,end,,2026/10/07 10:15:30,10.1.1.20,203.0.113.20,,,allow-outbound,,,ssl,vsys1,trust,untrust,ethernet1/1,ethernet1/2,default,,424242,1,51515,443,0,0,0x400000,tcp,allow,11000,1200,9800,22,2026/10/07 10:15:30,12,any,,7424242,0x8000000000000000,10.0.0.0-10.255.255.255,US,,10,12,tcp-fin,,,,,,PA-VM-01,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,2026-10-07T10:15:30.250+00:00,,,,,,,,,,,,,,,,,,,,,,,,,,,"
    expect:
      ulpf.status: parsed
      ulpf.parser.id: paloalto.panos.traffic
      time: 1791368130250
      src_endpoint.ip: 10.1.1.20
      src_endpoint.port: 51515
      src_endpoint.zone: trust
      dst_endpoint.ip: 203.0.113.20
      dst_endpoint.port: 443
      connection_info.protocol_name: tcp
      connection_info.protocol_num: 6
      activity_id: 2
      action_id: 1
      disposition_id: 1
      traffic.bytes_out: 1200
      traffic.bytes_in: 9800
      device.hostname: PA-VM-01
      firewall_rule.name: allow-outbound
  - name: source_user_is_pseudonymised
    raw: "<14>Oct  7 10:15:30 PA-VM-01 1,2026/10/07 10:15:30,007200001056,TRAFFIC,end,,2026/10/07 10:15:30,10.1.1.20,203.0.113.20,,,allow-outbound,acme\\jdoe,,ssl,vsys1,trust,untrust,ethernet1/1,ethernet1/2,default,,424242,1,51515,443,0,0,0x400000,tcp,allow,11000,1200,9800,22,2026/10/07 10:15:30,12,any,,7424242,0x8000000000000000,10.0.0.0-10.255.255.255,US,,10,12,tcp-fin,,,,,,PA-VM-01,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,2026-10-07T10:15:30.250+00:00,,,,,,,,,,,,,,,,,,,,,,,,,,,"
    expect:
      ulpf.status: parsed
      actor.user.name: hmac-sha256:9fd15bb804464dac396b9a74ebbfd20b87025fed227d93763f26fe2d4d57ae54
  - name: udp_deny
    raw: "<14>Oct  7 10:15:30 PA-VM-01 1,2026/10/07 10:15:30,007200001056,TRAFFIC,deny,,2026/10/07 10:15:30,10.1.1.20,203.0.113.20,,,default-deny,,,dns,vsys1,trust,untrust,ethernet1/1,ethernet1/2,default,,424242,1,40000,53,0,0,0x400000,udp,deny,0,0,0,1,2026/10/07 10:15:30,12,any,,7424242,0x8000000000000000,10.0.0.0-10.255.255.255,US,,1,0,policy-deny,,,,,,PA-VM-01,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,2026-10-07T10:15:30.250+00:00,,,,,,,,,,,,,,,,,,,,,,,,,,,"
    expect:
      ulpf.status: parsed
      activity_id: 5
      action_id: 2
      disposition_id: 2
      connection_info.protocol_name: udp
      connection_info.protocol_num: 17
  - name: invalid_dport_is_partial
    raw: "<14>Oct  7 10:15:30 PA-VM-01 1,2026/10/07 10:15:30,007200001056,TRAFFIC,end,,2026/10/07 10:15:30,10.1.1.20,203.0.113.20,,,allow-outbound,,,ssl,vsys1,trust,untrust,ethernet1/1,ethernet1/2,default,,424242,1,51515,abc,0,0,0x400000,tcp,allow,11000,1200,9800,22,2026/10/07 10:15:30,12,any,,7424242,0x8000000000000000,10.0.0.0-10.255.255.255,US,,10,12,tcp-fin,,,,,,PA-VM-01,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,2026-10-07T10:15:30.250+00:00,,,,,,,,,,,,,,,,,,,,,,,,,,,"
    expect:
      ulpf.status: partial
      unmapped.dport: abc
  - name: extra_columns_are_kept
    raw: "<14>Oct  7 10:15:30 PA-VM-01 1,2026/10/07 10:15:30,007200001056,TRAFFIC,end,,2026/10/07 10:15:30,10.1.1.20,203.0.113.20,,,allow-outbound,,,ssl,vsys1,trust,untrust,ethernet1/1,ethernet1/2,default,,424242,1,51515,443,0,0,0x400000,tcp,allow,11000,1200,9800,22,2026/10/07 10:15:30,12,any,,7424242,0x8000000000000000,10.0.0.0-10.255.255.255,US,,10,12,tcp-fin,,,,,,PA-VM-01,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,2026-10-07T10:15:30.250+00:00,,,,,,,,,,,,,,,,,,,,,,,,,,,,future-col-a,future-col-b"
    expect:
      ulpf.status: parsed
      unmapped._extra_130: future-col-a
      unmapped._extra_131: future-col-b
